recommendation_contract:
  top_3_definition: "Top three product recommendations within the selected equipment/category context."
  allowed_contexts:
    - Driver
    - Fairway Woods / Hybrids
    - Irons
    - Wedges
    - Putter
    - Golf Ball
  forbidden_interpretation: "Top three equipment categories / cross-category Better Bag priority ranking"
  data_rule: "No recommendation score or ranking may be fabricated when governed data is insufficient."

explicit_exclusions:
  - id: UX10.03_BETTER_BAG_SCORECARD
    classification: REJECTED_SUPERSEDED
    exclude:
      - Better Bag Priority Index
      - cross-category "Your Top 3 Better Bag Priorities"
      - invented whole-bag/category scores
      - standalone scorecard hierarchy competing with profile-centered My GAL
  - id: CSS_SCENE_APPROXIMATION
    classification: EXCLUDE
    exclude:
      - CSS sky/fairway/tree/course drawings used as substitutes for approved photography
      - CSS/shape bag approximations
  - id: SUPERSEDED_GOLFER_ART
    classification: EXCLUDE
    exclude:
      - earlier visual-library boards as runtime source
      - regenerated golfer/persona art where approved masters exist
  - id: UNGOVERNED_PRODUCT_MEDIA
    classification: EXCLUDE
    exclude:
      - retailer watermarks
      - Hot List/award/ranking graphics
      - promotional backgrounds
      - generic fallback product imagery
      - guessed sibling/model imagery

qa_gate:
  required:
    - provenance manifest complete and internally consistent
    - source hashes verified where available
    - exact historical photographic scene and bag assets recovered
    - no UX10.03 scorecard hierarchy
    - five primary navigation items preserved
    - final governed profile/persona system retained
    - photographic My GAL visual treatment restored
    - tee-box and bag remain independent presentation layers
    - category-level Top 3 only
    - governed equipment imagery or explicit hold state
    - truthful unknown/insufficient states
    - desktop contract tests pass
    - mobile contract tests pass
    - JavaScript syntax passes
    - visual regression comparison against approved references
  browser_policy: "If browser rendering is blocked, report BLOCKED/UNVERIFIED. Static checks are not a browser visual pass."

open_release_blockers:
