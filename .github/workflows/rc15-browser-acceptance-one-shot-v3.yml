name: RC15 Browser Acceptance One Shot v7

on:
  push:
    branches:
      - rc15-driver-browser-acceptance
    paths:
      - .github/workflows/rc15-browser-acceptance-one-shot-v3.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Run RC15 browser acceptance
        env:
          RC15_TARGET: 'https://gal-website-dzpo0ryag-gal25.vercel.app/rc15-browser-acceptance.html?_vercel_share=Zq56HZsNaTj3ojYJmi34EKhUtBP7ohMk'
          RC15_EXISTING_EMAIL: 'rc15-ui-314bb9de1990@mailinator.com'
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('playwright-core'),assert=require('assert');
          const TARGET=process.env.RC15_TARGET,email=process.env.RC15_EXISTING_EMAIL;
          const activeClubs=bag=>(bag?.items||[]).filter(x=>x.itemType==='CLUB'&&x.status==='IN_BAG'&&x.countsToward14);
          const activeDrivers=bag=>activeClubs(bag).filter(x=>x.category==='DRIVER'||x.slotCode==='D');
          async function waitText(page,selector,patterns,timeout=15000){await page.waitForFunction(({selector,patterns})=>patterns.some(p=>(document.querySelector(selector)?.textContent||'').includes(p)),{selector,patterns},{timeout});return (await page.locator(selector).innerText()).trim();}
          async function loadBag(page){return await page.evaluate(async()=>await window.__RC15_ACCEPTANCE.loadBag());}
          function allStrings(v,out=[]){if(typeof v==='string')out.push(v);else if(Array.isArray(v))v.forEach(x=>allStrings(x,out));else if(v&&typeof v==='object')Object.values(v).forEach(x=>allStrings(x,out));return out;}
          function linksFrom(v){const out=[];for(const s of allStrings(v)){for(const m of s.matchAll(/https?:\/\/[^\s"'<>]+/g))out.push(m[0].replace(/&amp;/g,'&'));}return [...new Set(out)];}
          async function confirmationLink(email){const inbox=email.split('@')[0];const r=await fetch(`https://www.mailinator.com/api/v2/domains/public/inboxes/${encodeURIComponent(inbox)}?limit=10&sort=descending`);assert(r.ok,'Could not list disposable inbox');const j=await r.json();const msgs=j.msgs||j.messages||[];assert(msgs.length,'Confirmation email not found');const id=msgs[0].id||msgs[0]._id;const mr=await fetch(`https://www.mailinator.com/api/v2/domains/public/inboxes/${encodeURIComponent(inbox)}/messages/${encodeURIComponent(id)}`);assert(mr.ok,'Could not fetch confirmation email');const body=await mr.json();const links=linksFrom(body);const verify=links.find(x=>x.includes('/auth/v1/verify')||x.includes('token_hash=')||x.includes('token='));assert(verify,'Supabase confirmation link not found');return verify;}
          async function establishSession(page,verify){await page.goto(verify,{waitUntil:'domcontentloaded',timeout:30000}).catch(()=>{});await page.waitForTimeout(1200);const redirected=page.url(),u=new URL(redirected),h=new URLSearchParams(u.hash.replace(/^#/,'')),q=u.searchParams;const access=h.get('access_token'),refresh=h.get('refresh_token'),code=q.get('code');await page.goto(TARGET,{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>!!window.GALRemote?.ready?.(),null,{timeout:15000});if(access&&refresh){const r=await page.evaluate(async s=>{const c=window.GALRemote.ready();const x=await c.auth.setSession(s);return {error:x.error?.message||null};},{access_token:access,refresh_token:refresh});if(r.error)throw new Error(r.error);}else if(code){const r=await page.evaluate(async ccode=>{const c=window.GALRemote.ready();const x=await c.auth.exchangeCodeForSession(ccode);return {error:x.error?.message||null};},code);if(r.error)throw new Error(r.error);}const user=await page.evaluate(async()=>{const c=window.GALRemote.ready();const r=await c.auth.getUser();return r.data?.user?{id:r.data.user.id}:null;});assert(user,'Confirmation link did not establish an authenticated session');return user;}
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const result={checks:{}};try{
            const c1=await browser.newContext(),p1=await c1.newPage();const verify=await confirmationLink(email);await establishSession(p1,verify);const password=`Rc15!${crypto.randomBytes(24).toString('hex')}Aa7`;const change=await p1.evaluate(async value=>{const c=window.GALRemote.ready();const r=await c.auth.updateUser({password:value});return {error:r.error?.message||null};},password);assert(!change.error,change.error);result.checks.synthetic_account='PASS';
            const empty=await loadBag(p1);assert.strictEqual(activeClubs(empty).length,0,'synthetic bag must start empty');await p1.click('#seed14');await p1.waitForTimeout(1000);const bag14=await loadBag(p1);assert.strictEqual(activeClubs(bag14).length,14,'fixture must contain 14 active clubs');result.checks.seed_14_clubs='PASS';
            await p1.click('#addPrimary');const addText=await waitText(p1,'#driverBagStatus',['Saved to My GAL.','ERROR','My Bag save did not complete']);assert(addText.includes('Saved to My GAL.'),addText);assert(addText.includes('15 clubs in this bag'),'15-club warning not rendered: '+addText);const bag15=await loadBag(p1);assert.strictEqual(activeClubs(bag15).length,15);assert.strictEqual(activeDrivers(bag15).length,1);assert.strictEqual(activeDrivers(bag15)[0].canonicalProductId,'GAL-DRV-0003');assert((bag15.decisions||[]).some(d=>d.canonicalProductIdAtDecision==='GAL-DRV-0003'&&d.sourceTool==='driver_buyers_guide'),'Driver recommendation decision lineage missing');result.checks.driver_add_15_club_warning='PASS';result.checks.decision_lineage='PASS';
            await p1.click('#addSecond');const conflict=await waitText(p1,'#driverBagStatus',['A Driver is already active in My Bag.','ERROR','My Bag save did not complete']);assert(conflict.includes('A Driver is already active in My Bag.'),conflict);const after=await loadBag(p1);assert.strictEqual(activeDrivers(after).length,1);assert.strictEqual(activeDrivers(after)[0].canonicalProductId,'GAL-DRV-0003');result.checks.duplicate_slot_d_ui='PASS';await p1.screenshot({path:'rc15-session1.png',fullPage:true});
            await p1.click('#signOut');let signed=await waitText(p1,'#authStatus',['SIGNED OUT','ERROR']);assert.strictEqual(signed,'SIGNED OUT');await p1.fill('#email',email);await p1.fill('#password',password);await p1.click('#signIn');signed=await waitText(p1,'#authStatus',['SIGNED IN','ERROR']);assert(signed.startsWith('SIGNED IN'),signed);const restored=await loadBag(p1);assert.strictEqual(activeDrivers(restored).length,1);assert.strictEqual(activeDrivers(restored)[0].canonicalProductId,'GAL-DRV-0003');result.checks.logout_login_persistence='PASS';
            const c2=await browser.newContext(),p2=await c2.newPage();await p2.goto(TARGET,{waitUntil:'domcontentloaded'});await p2.waitForFunction(()=>!!window.__RC15_ACCEPTANCE,null,{timeout:15000});await p2.fill('#email',email);await p2.fill('#password',password);await p2.click('#signIn');const auth2=await waitText(p2,'#authStatus',['SIGNED IN','ERROR']);assert(auth2.startsWith('SIGNED IN'),auth2);const restored2=await loadBag(p2);assert.strictEqual(activeDrivers(restored2).length,1);assert.strictEqual(activeDrivers(restored2)[0].canonicalProductId,'GAL-DRV-0003');result.checks.second_browser_session='PASS';await p2.screenshot({path:'rc15-session2.png',fullPage:true});
            result.synthetic_email=email;result.active_club_count=activeClubs(restored2).length;result.driver=activeDrivers(restored2)[0].canonicalProductId;result.status='PASS';fs.writeFileSync('rc15-browser-result.json',JSON.stringify(result,null,2));console.log('RC15_BROWSER_RESULT='+JSON.stringify(result));await p2.click('#signOut').catch(()=>{});await c2.close();await p1.click('#signOut').catch(()=>{});await c1.close();
          }catch(err){result.synthetic_email=email;result.status='FAIL';result.error=String(err&&err.stack||err);fs.writeFileSync('rc15-browser-result.json',JSON.stringify(result,null,2));console.error('RC15_BROWSER_RESULT='+JSON.stringify(result));throw err;}finally{await browser.close();}})();
          NODE
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc15-browser-acceptance-evidence-v7
          path: |
            rc15-browser-result.json
            rc15-session1.png
            rc15-session2.png
