name: GI-1.1 Backend Tests

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main
    paths:
      - 'supabase/**'
      - 'docs/superpowers/specs/2026-08-28-golfer-intelligence-data-model-v1.1-design.md'
      - 'docs/superpowers/plans/2026-08-29-gi-1.1-*.md'
      - '.github/workflows/gi-backend-tests.yml'
  workflow_dispatch:

jobs:
  database-tests:
    name: Isolated Supabase baseline + pgTAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Initialize local Supabase config
        shell: bash
        run: |
          supabase init --force
          sed -i -E 's/^major_version = .*/major_version = 17/' supabase/config.toml
          grep -n 'major_version' supabase/config.toml

      - name: Start isolated local Supabase
        run: supabase start --debug

      - name: Install PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Apply sanitized production-core baseline
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/test-baseline/gal_core_current_shape.sql

      - name: Apply forward GI migrations
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        shell: bash
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          for file in "${files[@]}"; do
            echo "Applying $file"
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
