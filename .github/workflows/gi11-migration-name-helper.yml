name: GI-1.1 Migration Name Helper
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Generate migration filename
        shell: bash
        run: |
          supabase init --force
          supabase migration new gi11_intelligence_state_metadata
          echo "GENERATED_MIGRATION=$(basename "$(ls -1 supabase/migrations/*_gi11_intelligence_state_metadata.sql | tail -1)")"
