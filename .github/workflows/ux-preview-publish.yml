name: Publish UX Preview

on:
  push:
    branches:
      - ux-reconciliation-rc
      - feature/gal-ux10-01-tee-box-personalization
    paths-ignore:
      - 'preview/**'

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: portal/pnpm-lock.yaml
      - name: Restore locked GAL Option 7A logo
        run: |
          cat portal/brand/gal-option7a-motion.b64.part* | base64 --decode > portal/public/gal-option7a-motion.jpg
          test "$(wc -c < portal/public/gal-option7a-motion.jpg)" -eq 15946
          echo "26ccad548313c1d018cb6421efdfc4a95fb18d2e5123eccdc0518777a5b7047a  portal/public/gal-option7a-motion.jpg" | sha256sum --check --strict
      - name: Restore governed UX10 independent scene assets
        run: |
          restore_parts() {
            pattern="$1"
            output="$2"
            : > "$output"
            for part in $pattern; do
              base64 --decode "$part" >> "$output"
            done
          }
          restore_bag() {
            head_file="$1"
            tail_file="$2"
            output="$3"
            python -c "import base64,re,sys; t=open(sys.argv[1],encoding='utf-8').read(); c=re.sub(r'[^A-Za-z0-9+/=]','',t)[:20000]; assert len(c)==20000, (sys.argv[1],len(c)); open(sys.argv[2],'wb').write(base64.b64decode(c,validate=True))" "$head_file" "$output"
            base64 --decode "$tail_file" >> "$output"
          }
          mkdir -p portal/public/ux10/tee-boxes portal/public/ux10/bags
          restore_parts 'portal/ux10-assets/coastal-01.b64.part*' portal/public/ux10/tee-boxes/coastal-01.webp
          restore_parts 'portal/ux10-assets/cliffs-01.b64.part*' portal/public/ux10/tee-boxes/cliffs-01.webp
          restore_bag portal/ux10-assets/gal-tour-bag.b64.part1 portal/ux10-assets/gal-tour-bag.tail.b64 portal/public/ux10/bags/gal-tour-bag.png
          restore_bag portal/ux10-assets/gal-stand-bag.b64.part1 portal/ux10-assets/gal-stand-bag.tail.b64 portal/public/ux10/bags/gal-stand-bag.png
          test "$(wc -c < portal/public/ux10/tee-boxes/coastal-01.webp)" -eq 23560
          test "$(wc -c < portal/public/ux10/tee-boxes/cliffs-01.webp)" -eq 30352
          test "$(wc -c < portal/public/ux10/bags/gal-tour-bag.png)" -eq 23372
          test "$(wc -c < portal/public/ux10/bags/gal-stand-bag.png)" -eq 19207
          echo "a2573d5603e24d67ba00b9bdc784340c57d5a35e3e92c40c51b53e5667faf7f9  portal/public/ux10/tee-boxes/coastal-01.webp" | sha256sum --check --strict
          echo "4391c368868fee62aeb7c7cc002e2529bfb9ba8e0a6af96472bddb81f9a82f47  portal/public/ux10/tee-boxes/cliffs-01.webp" | sha256sum --check --strict
          echo "7bf811eb4f7352779f6f3af1dfc50b4b8bf71f01fa5f6c21380dc3b7cdfb375d  portal/public/ux10/bags/gal-tour-bag.png" | sha256sum --check --strict
          echo "488e4f6fec76007f0f4f6e2a32a5a57fbdea849c8da78ccd9bdb634a6150ca28  portal/public/ux10/bags/gal-stand-bag.png" | sha256sum --check --strict
      - name: Install verified dependencies
        working-directory: portal
        run: pnpm install --frozen-lockfile
      - name: Verify portal
        working-directory: portal
        run: pnpm run test:run
      - name: Build static review portal against staging
        working-directory: portal
        env:
          VITE_SUPABASE_URL: https://ylrxwtbzavhxxpoqqmho.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jgy4llwo5UhX4mg3EZ6VSA_xhyPOcVp
        run: pnpm run build
      - name: Reject forbidden browser material and sample facts
        working-directory: portal
        run: |
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' dist; then
            echo 'Forbidden service-role material found in portal build.'
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.html' -E '94 mph|247 yds|\+12 Yards|\$3,840|78%|71%|\+11\.3 yds' dist; then
            echo 'Forbidden sample golfer fact found in rendered UX10 application material.'
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.html' -F '/portal/ux5/reference-bag.webp' dist; then
            echo 'Retired combined UX5 course-and-bag scene found in UX10 build.'
            exit 1
          fi
          if grep -R -n -E 'rcux4-visuals' dist; then
            echo 'Retired RCUX4 visual authority found in UX10 build.'
            exit 1
          fi
      - name: Upload verified RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAL-UX10.01-RC1-verified-preview
          path: portal/dist
          if-no-files-found: error
          retention-days: 7
      - name: Publish prebuilt preview into branch
        run: |
          rm -rf preview
          mkdir -p preview/portal
          cp -R portal/dist/. preview/portal/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f portal/public/gal-option7a-motion.jpg portal/public/ux10 preview
          if git diff --cached --quiet; then
            echo 'Preview already current.'
            exit 0
          fi
          git commit -m 'preview: publish verified GAL UX10.01 RC1 [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
