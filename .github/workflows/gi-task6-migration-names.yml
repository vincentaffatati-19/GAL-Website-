name: GI Task 6 Migration Names

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/gi-task6-migration-names.yml'

jobs:
  generate-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Generate Task 6 migration filenames
        shell: bash
        run: |
          supabase init --force
          supabase migration new gi11_questions
          FIRST=$(ls -1t supabase/migrations/*.sql | head -1 | xargs basename)
          sleep 1
          supabase migration new gi11_seed_questions
          SECOND=$(ls -1t supabase/migrations/*.sql | head -1 | xargs basename)
          echo "QUESTIONS_MIGRATION=$FIRST"
          echo "SEED_MIGRATION=$SECOND"
