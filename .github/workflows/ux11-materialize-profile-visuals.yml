name: UX11 Materialize Locked Profile Visuals

on:
  push:
    branches:
      - feature/ux11-profile-integration-recovery
    paths:
      - scripts/ux11/materialize-profile-visuals-from-verified-transport.py
      - .github/workflows/ux11-materialize-profile-visuals.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: feature/ux11-profile-integration-recovery
      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact locked resolver
        run: python scripts/ux11/materialize-profile-visuals-from-verified-transport.py
      - name: Verify generated resolver syntax and contract surface
        shell: bash
        run: |
          node --check profile__visuals.js
          node - <<'NODE'
          const assert=require('assert');
          const v=require('./profile__visuals.js');
          assert.strictEqual(v.PERSONA_KEYS.length,12);
          for(const key of v.PERSONA_KEYS){
            assert(v.PERSONAS[key]&&v.PERSONAS[key].body&&v.PERSONAS[key].swing,key);
          }
          assert.strictEqual(v.resolveGolferVisual('Male',''),'male_age_unspecified');
          assert.strictEqual(v.resolveGolferVisual('Female',''),'female_age_unspecified');
          assert.strictEqual(v.resolveGolferVisual('Male','65–74'),'male_senior');
          assert.strictEqual(v.resolveGolferVisual('Female','75+'),'female_senior');
          console.log('PASS: locked resolver contract surface');
          NODE
      - name: Commit generated locked resolver
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- profile__visuals.js)" ]; then
            echo 'profile__visuals.js already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'vincentaffatati-19'
          git config user.email 'vincent.affatati@gmail.com'
          git add profile__visuals.js
          git commit -m 'build(ux11): materialize locked Profile visual resolver'
          git push origin HEAD:feature/ux11-profile-integration-recovery
