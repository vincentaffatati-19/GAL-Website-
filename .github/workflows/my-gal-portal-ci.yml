name: My GAL Portal CI

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'drivers.html'
      - 'supabase/migrations/20260904022000_consumer_commercial_consent.sql'
      - 'supabase/tests/consumer_commercial_consent.sql'
      - '.github/workflows/my-gal-portal-ci.yml'

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: portal/pnpm-lock.yaml
      - name: Restore locked GAL Option 7A logo
        working-directory: .
        run: |
          cat portal/brand/gal-option7a-motion.b64.part* | base64 --decode > portal/public/gal-option7a-motion.jpg
          test "$(wc -c < portal/public/gal-option7a-motion.jpg)" -eq 15946
          echo "26ccad548313c1d018cb6421efdfc4a95fb18d2e5123eccdc0518777a5b7047a  portal/public/gal-option7a-motion.jpg" | sha256sum --check --strict
      - name: Restore governed UX5 realistic scene
        working-directory: .
        run: |
          mkdir -p portal/public/ux5
          cat portal/ux5-assets/reference-bag.b64.part* | base64 --decode > portal/public/ux5/reference-bag.webp
          test "$(wc -c < portal/public/ux5/reference-bag.webp)" -eq 20240
          echo "11c1f63ab18cb952d1d3ca1a9831905117e93231257b37535a6855b168e3b85f  portal/public/ux5/reference-bag.webp" | sha256sum --check --strict
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:run
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: pnpm run build
      - name: Reject service-role material in browser build
        run: |
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' dist; then
            echo 'Forbidden service-role material found in portal build.'
            exit 1
          fi
      - name: Publish verified portal build
        uses: actions/upload-artifact@v4
        with:
          name: my-gal-portal-dist
          path: portal/dist
          if-no-files-found: error
          retention-days: 7
