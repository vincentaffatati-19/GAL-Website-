name: My GAL Portal CI

on:
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/my-gal-portal-ci.yml'

permissions:
  contents: write

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: add portal pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Unit tests
        run: pnpm run test:run
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: pnpm run build
      - name: Reject service-role material in browser build
        run: |
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' dist; then
            echo 'Forbidden service-role material found in portal build.'
            exit 1
          fi
