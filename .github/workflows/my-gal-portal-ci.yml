name: My GAL Portal CI

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'drivers.html'
      - 'supabase/migrations/20260904022000_consumer_commercial_consent.sql'
      - 'supabase/tests/consumer_commercial_consent.sql'
      - '.github/workflows/my-gal-portal-ci.yml'

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: portal/pnpm-lock.yaml
      - name: Restore locked UX10 Stylized Option B Motion Arc logo
        working-directory: .
        run: |
          cat portal/brand/gal-motion-arc-dark-lockup.b64.part* | base64 --decode > portal/public/gal-motion-arc-dark-lockup.webp
          test "$(wc -c < portal/public/gal-motion-arc-dark-lockup.webp)" -eq 15580
          echo "8cd2030c7b3f4e75a9474dbd3e9f27e6697ce89ea756f22a5c4749192c117636  portal/public/gal-motion-arc-dark-lockup.webp" | sha256sum --check --strict
      - name: Restore governed UX10 independent scene assets
        working-directory: .
        run: |
          restore_parts() {
            pattern="$1"
            output="$2"
            : > "$output"
            for part in $pattern; do
              base64 --decode "$part" >> "$output"
            done
          }
          mkdir -p portal/public/ux10/tee-boxes portal/public/ux10/bags
          restore_parts 'portal/ux10-assets/coastal-01.b64.part*' portal/public/ux10/tee-boxes/coastal-01.webp
          restore_parts 'portal/ux10-assets/cliffs-01.b64.part*' portal/public/ux10/tee-boxes/cliffs-01.webp
          cat portal/ux10-assets/gal-tour-bag.fixed.part01 portal/ux10-assets/gal-tour-bag.fixed.part02 portal/ux10-assets/gal-tour-bag.b64.part2 | base64 --decode > portal/public/ux10/bags/gal-tour-bag.png
          cat portal/ux10-assets/gal-stand-bag.fixed.part01 portal/ux10-assets/gal-stand-bag.fixed.part02 portal/ux10-assets/gal-stand-bag.b64.part2 | base64 --decode > portal/public/ux10/bags/gal-stand-bag.png
          test "$(wc -c < portal/public/ux10/tee-boxes/coastal-01.webp)" -eq 23560
          test "$(wc -c < portal/public/ux10/tee-boxes/cliffs-01.webp)" -eq 30352
          test "$(wc -c < portal/public/ux10/bags/gal-tour-bag.png)" -eq 17841
          test "$(wc -c < portal/public/ux10/bags/gal-stand-bag.png)" -eq 14867
          echo "a2573d5603e24d67ba00b9bdc784340c57d5a35e3e92c40c51b53e5667faf7f9  portal/public/ux10/tee-boxes/coastal-01.webp" | sha256sum --check --strict
          echo "4391c368868fee62aeb7c7cc002e2529bfb9ba8e0a6af96472bddb81f9a82f47  portal/public/ux10/tee-boxes/cliffs-01.webp" | sha256sum --check --strict
          echo "94d18e5ca9dd4045ddbe199b4b91cce7c537beba9c030166a5c02f65b2aadc9f  portal/public/ux10/bags/gal-tour-bag.png" | sha256sum --check --strict
          echo "7ffd0881aafdc8885e468ad929a88d4a3dcbc1cece8b0e9b471720da27443d4c  portal/public/ux10/bags/gal-stand-bag.png" | sha256sum --check --strict
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:run
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: pnpm run build
      - name: Reject forbidden browser material and sample facts
        run: |
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' dist; then
            echo 'Forbidden service-role material found in portal build.'
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.html' -E '94 mph|247 yds|\+12 Yards|\$3,840|78%|71%|\+11\.3 yds' dist; then
            echo 'Forbidden sample golfer fact found in rendered UX10 application material.'
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.html' -F '/portal/ux5/reference-bag.webp' dist; then
            echo 'Retired combined UX5 course-and-bag scene found in UX10 build.'
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.html' -F '/portal/gal-option7a-motion.jpg' dist; then
            echo 'Retired GAL logo found in active UX10 build.'
            exit 1
          fi
      - name: Publish verified portal build
        uses: actions/upload-artifact@v4
        with:
          name: GAL-UX10.02-RC1-portal-dist
          path: portal/dist
          if-no-files-found: error
          retention-days: 7
